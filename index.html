<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DREAM Home">
    <meta name="keywords" content="Dream,Homepage">
    <meta name="author" content="Dream">
    <title>Dream Home</title>
    <!-- 完全移除可能冲突的外部CSS，所有样式内置 -->
    <style>
        /* 全局基础样式 - 确保所有元素正常显示 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 强制显示所有元素，避免被外部样式隐藏 */
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            color: #fff;
        }
        /* 背景面板 - 核心样式 */
        #panel {
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            position: relative;
            padding: 20px;
        }
        /* 背景遮罩层 */
        .panel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }
        /* 内容容器 - 确保在遮罩层上方 */
        .content-wrapper {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding-top: 50px;
        }
        /* 头像样式 - 强制显示 */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin: 0 auto 20px;
        }
        /* 头像下方文字 */
        .avatar-text {
            margin-bottom: 20px;
        }
        .avatar-text h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .avatar-text p {
            font-size: 16px;
        }
        /* 标题样式 */
        .main-title {
            font-size: 36px;
            margin: 20px 0;
            text-decoration: none;
            color: #fff;
        }
        .sub-title {
            font-size: 18px;
            margin: 15px 0;
        }
        /* 描述文本 */
        .description {
            font-size: 16px;
            line-height: 1.6;
            margin: 20px 0 30px;
        }
        /* 导航按钮样式 */
        .nav-group {
            margin: 20px 0;
        }
        .nav-button {
            display: inline-block !important;
            color: #fff;
            text-decoration: none;
            padding: 10px 18px;
            margin: 0 8px 15px;
            border: 1px solid #fff;
            border-radius: 6px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.1);
        }
        .nav-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        /* 社交导航 */
        .social-nav {
            margin-top: 30px;
        }
        .social-nav .nav-button {
            padding: 8px 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 背景面板 -->
    <div id="panel">
        <!-- 背景遮罩 -->
        <div class="panel-overlay"></div>
        <!-- 核心内容 -->
        <div class="content-wrapper">
            <!-- 头像区域（强制显示） -->
            <img src="https://picsum.photos/id/64/150/150" alt="头像" class="avatar">
            <div class="avatar-text">
                <h2>之昂張</h2>
                <p>2024 · 勇敢</p>
            </div>

            <!-- 标题 -->
            <a href="#" class="main-title">Dream</a>
            <p class="sub-title">知其不可奈何而安之若命.</p>
            <hr style="margin: 20px 0; border: 1px solid rgba(255,255,255,0.3)">

            <!-- 描述 -->
            <div class="description">
                如何得与凉风约, 不共尘沙一并来!
                <br/>
                <strong>-「青云如梦」</strong>
            </div>

            <!-- 主导航（性格测试等，强制显示） -->
            <div class="nav-group">
                <a href="https://sourl.cn/z2J7Qi" class="nav-button" target="_blank">性格测试</a>
                <a href="https://qm.qq.com/cgi-bin/qm/qr?k=tSCqfVp5bGVenjcpQ-pEebLCpZa3LdXJ" class="nav-button" target="_blank">加我QQ</a>
                <a href="https://sourl.cn/z29mh7" class="nav-button" target="_blank">资源库吖</a>
                <a href="https://ym.ksjhaoka.com/?s=Lh5y9BsT57680" class="nav-button" target="_blank">找我办卡</a>
            </div>

            <!-- 社交导航 -->
            <div class="social-nav">
                <a href="https://sourl.cn/YpZQkR" class="nav-button" target="_blank">
                    <span>github</span>
                </a>
                <a href="https://www.apesk.com/mbti/dati28N.asp" class="nav-button" target="_blank">
                    <span>cnblogs</span>
                </a>
                <a href="https://dai.dreamzhm519.eu.org/proxy/www.google.com/search?q=" class="nav-button" target="_blank">
                    <span>zhihu</span>
                </a>
                <a href="mailto:xiaolaoban473@gmail.com" class="nav-button" target="_blank">
                    <span>email</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 背景图脚本 - 极简版，确保加载 -->
    <script>
        // 背景图列表（Picsum+Unsplash）
        const bgImages = [
            "https://picsum.photos/id/1018/1920/1080",
            "https://picsum.photos/id/1039/1920/1080",
            "https://source.unsplash.com/random/1920x1080/?star,night",
            "https://source.unsplash.com/random/1920x1080/?ocean,wave"
        ];

        // 随机设置背景图
        function setBg() {
            const randomImg = bgImages[Math.floor(Math.random() * bgImages.length)];
            document.getElementById('panel').style.backgroundImage = `url(${randomImg})`;
        }

        // 页面加载立即设置
        window.onload = setBg;
        // 点击页面切换背景
        document.getElementById('panel').onclick = setBg;
    </script>
</body>
</html>
