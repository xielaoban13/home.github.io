    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
        }
        /* 背景面板核心样式 - 确保背景图铺满屏幕 */
        #panel.panel-cover {
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            position: relative;
        }
        /* 背景遮罩层 - 让文字更清晰 */
        .panel-cover--overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }
        /* 内容层 - 显示在遮罩层上方 */
        .panel-main {
            position: relative;
            z-index: 2;
            padding: 20px;
            color: #fff;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding-top: 80px;
        }
        /* 头像样式 */
        .js-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
        }
        /* 按钮样式优化 */
        .blog-button {
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            margin: 0 5px;
            border: 1px solid #fff;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .blog-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        /* 文字样式 */
        .panel-title a {
            color: #fff;
            text-decoration: none;
            font-size: 36px;
            margin: 20px 0;
            display: inline-block;
        }
        .panel-subtitle {
            font-size: 18px;
            margin: 15px 0;
        }
        .panel-cover__description {
            font-size: 16px;
            line-height: 1.6;
            margin: 20px 0;
        }
        .navigation {
            list-style: none;
            margin: 20px 0;
        }
        .navigation__item {
            display: inline-block;
            margin: 0 5px;
        }
    </style>
</head>

    <!-- 背景图加载脚本 - 直接用完整URL，无需函数拼接 -->
    <script>
        // 简化版背景图设置函数（直接使用传入的完整URL）
        function getBingImages(fullImageUrls) {
            // 随机选一张背景图
            const randomIndex = Math.floor(Math.random() * fullImageUrls.length);
            const randomImageUrl = fullImageUrls[randomIndex];
            // 设置为背景
            const panel = document.getElementById('panel');
            if (panel) {
                panel.style.backgroundImage = `url(${randomImageUrl})`;
            }
        }

        // 重点：这里直接传入完整的必应图片URL（已补全域名）
        getBingImages([
            "https://www.bing.com/th?id=OHR.NuzzleManatee_EN-US6719438929_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp",

            "https://www.bing.com/th?id=OHR.LakePowellAerial_EN-US5762979140_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp"
        ]);

        // 邮箱解密函数（保留原有功能）
        function decryptEmail(encoded) {
            const decoded = atob(encoded);
            window.location.href = `mailto:${decoded}`;
